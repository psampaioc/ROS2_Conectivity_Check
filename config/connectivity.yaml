ping_checker:
  update_rate_hz: 1.0
  ping_count: 3
  timeout_ms: 1000
  packet_size: 56
  targets:
    - label: "router"
      host: "192.168.1.1"
      enabled: true
      interface: ""
    - label: "internet"
      host: "8.8.8.8"
      enabled: true
      interface: ""

rss_monitor:
  update_rate_hz: 1.0
  interface: "wlp3s0"

connectivity_monitor:
  update_rate_hz: 1.0
  enabled: true

speedtest_server:
  enabled: true
  provider: "speedtest-cli"
  timeout_sec: 120